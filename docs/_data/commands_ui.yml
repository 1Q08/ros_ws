# ============================================================
# 命令速查页共享 UI 文案（commands.html / en/commands.html）
# ============================================================
# 供 _includes/command-reference.html 使用，键名与模板里的 t.xxx 一一对应。
# 结构：顶层键 = 语言代码（与页面 front matter 的 lang 一致，经 include 参数传入）。
# 新增语言时在此追加一个顶层键（如 ja:），页面里写 lang="ja" 即可。
# 注意：只放「可见文案」；HTML 结构在 _includes，页面配置（数据文件地址）在页面里。
# ============================================================

