title: ROS 命令速查
title_en: ROS Command Reference
author: 老张同志
email: example@163.com
description: 开源的 ROS 1 / ROS 2 命令查找工具
description_en: An open-source ROS 1 / ROS 2 command reference tool
lang: zh-CN
baseurl: "/ros_ws"
url: "https://1q08.github.io"

# 社交链接
github_username: 1Q08
rss: rss
# 飞书群邀请链接（留空则页脚不显示飞书图标）
feishu_url: "https://applink.feishu.cn/client/chat/chatter/add_by_link?link_token=7aej86f8-102d-4ed8-89b6-c80a4dcd2bff"

# 文章摘要显示
show_excerpts: true

# Minima 日期格式
# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
minima:
  date_format: "%b %-d, %Y"

# 主题
theme: minima

# minima 2.5 导航配置
header_pages:
  - about.md
  - commands.html
  - archive.md

# 插件
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 排除：以下文件不参与构建，也不会被复制到站点里
# ⚠️ 注意：Jekyll 的 exclude 是「整体替换」而不是「追加」。
#    默认值写死在 lib/jekyll/configuration.rb 的 DEFAULTS 里，
#    只要在这里写了 exclude，默认值就被顶掉，
#    所以下面 7 个默认项必须原样保留，否则 Gemfile / Gemfile.lock 会被发布到网站上。
exclude:
  # --- Jekyll 3.10 默认项（不要删） ---
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # --- 本站自定义项 ---
  # 文档站的中文手册，只供在 GitHub 上阅读，不作为网站页面发布
  - README.zh-CN.md
