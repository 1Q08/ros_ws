title: ROS 命令速查
title_en: ROS Command Reference
author: 老张同志
email: tristanzhang350924@gmail.com
description: 开源的 ROS 1 / ROS 2 命令查找工具
description_en: An open-source ROS 1 / ROS 2 command reference tool
lang: zh-CN
baseurl: "/ros_ws"
url: "https://1q08.github.io"

# 社交链接
github_username: 1Q08
rss: rss
# 飞书群邀请链接（留空则页脚不显示飞书图标）
feishu_url: "https://applink.feishu.cn/client/chat/chatter/add_by_link?link_token=7aej86f8-102d-4ed8-89b6-c80a4dcd2bff"

# 文章摘要显示
show_excerpts: true

# Minima 日期格式
# refer to http://shopify.github.io/liquid/filters/date/ if you want to customize this
# date_format    英文页面使用（英文月份缩写）
# date_format_cn 中文页面使用（数字格式，避免中英混排）
minima:
  date_format: "%b %-d, %Y"
  date_format_cn: "%Y-%m-%d"

# 主题
theme: minima

# minima 2.5 导航配置
header_pages:
  - about.md
  - commands.html
  - archive.md

# 插件
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-avatar

# 站长身份验证
# Google Search Console 用「网址前缀」形式验证 https://1q08.github.io/ros_ws/
# 由 jekyll-seo-tag 的 {% seo %} 自动输出：
#   <meta name="google-site-verification" content="...">
# 以后加 Bing 可改用：
#   webmaster_verifications:
#     google: <同一串 token>
#     bing:   <Bing 的 token>
google_site_verification: ZVKDGNbaMpndfSaALqR26tb8mpH8ZqSwnRENo4k52Xs

# 排除：以下文件不参与构建，也不会被复制到站点里
# ⚠️ 注意：Jekyll 的 exclude 是「整体替换」而不是「追加」。
#    默认值写死在 lib/jekyll/configuration.rb 的 DEFAULTS 里，
#    只要在这里写了 exclude，默认值就被顶掉，
#    所以下面 7 个默认项必须原样保留，否则 Gemfile / Gemfile.lock 会被发布到网站上。
exclude:
  # --- Jekyll 3.10 默认项（不要删） ---
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # --- 本站自定义项 ---
  # 文档站的中英文手册，只供在 GitHub 上阅读，不作为网站页面发布
  - README.zh-CN.md
  - README.md
  # 命令数据一致性校验脚本，仅供本地开发使用
  - tools/
