---
layout: default
---

<style type="text/css" media="screen">
  .page-404 {
    max-width: 680px;
    margin: 20px auto;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }

  .terminal {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    overflow: hidden;
  }

  .terminal-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: #2a2a2a;
    border-bottom: 1px solid #333;
  }

  .terminal-bar .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }

  .dot-red { background: #ff5f56; }
  .dot-yellow { background: #ffbd2e; }
  .dot-green { background: #27c93f; }

  .terminal-title {
    margin-left: 8px;
    font-size: 13px;
    color: #9aa0a6;
  }

  .terminal-body {
    padding: 22px 22px 26px;
    font-size: 15px;
    line-height: 1.9;
  }

  .term-line {
    margin: 0 0 6px;
    color: #e6e6e6;
    word-break: break-all;
  }

  .term-prompt {
    color: #4ec9b0;
    margin-right: 8px;
    font-weight: 600;
  }

  .term-error {
    color: #ff6b6b;
    font-weight: 600;
  }

  .term-info {
    color: #e6e6e6;
  }

  .term-dim {
    color: #9aa0a6;
  }

  .term-cursor {
    display: inline-block;
    width: 9px;
    height: 17px;
    background: #4ec9b0;
    vertical-align: -2px;
    animation: term-blink 1s step-end infinite;
  }

  @keyframes term-blink {
    50% { opacity: 0; }
  }

  .page-404-actions {
    margin-top: 20px;
    text-align: center;
  }

  .btn-back {
    display: inline-block;
    padding: 10px 26px;
    border: 1px solid #4ec9b0;
    border-radius: 8px;
    color: #4ec9b0;
    font-family: inherit;
    font-size: 15px;
    text-decoration: none;
    transition: all 0.2s ease;
  }

  .btn-back:hover {
    background: #4ec9b0;
    color: #1e1e1e;
  }
</style>

<div class="page-404">
  <div class="terminal">
    <div class="terminal-bar">
      <span class="dot dot-red"></span>
      <span class="dot dot-yellow"></span>
      <span class="dot dot-green"></span>
      <span class="terminal-title">ros — bash</span>
    </div>
    <div class="terminal-body">
      <p class="term-line"><span class="term-prompt">$</span> roscore</p>
      <p class="term-line term-error">[ERROR] 404: 页面走丢了</p>
      <p class="term-line term-info">[INFO] 您访问的页面不存在或已被移除</p>
      <p class="term-line term-dim">这个页面像没保存的代码一样，悄悄消失在了终端里。</p>
      <p class="term-line"><span class="term-prompt">$</span> cd ~<span class="term-cursor"></span></p>
    </div>
  </div>
  <p class="page-404-actions">
    <a class="btn-back" href="{{ '/' | relative_url }}">返回首页</a>
  </p>
</div>
