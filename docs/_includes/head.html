<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- 收藏夹/标签页图标（favicon）：
       默认按系统主题显示，之后跟随页面深浅色切换按钮实时更新 -->
  <link rel="icon" id="dynamic-favicon" type="image/svg+xml"
        href="{{ "/assets/icons/favicon.svg" | relative_url }}"
        data-light="{{ "/assets/icons/favicon.svg" | relative_url }}"
        data-dark="{{ "/assets/icons/favicon-dark.svg" | relative_url }}">
  <script>
    (function () {
      function applyFavicon(theme) {
        var link = document.getElementById('dynamic-favicon');
        if (!link) return;
        var src = theme === 'dark' ? link.getAttribute('data-dark') : link.getAttribute('data-light');
        if (src) link.href = src;
        // 同步更新页眉站点标题图标
        var titleIcon = document.getElementById('site-title-icon');
        if (titleIcon) {
          var iconSrc = theme === 'dark' ? titleIcon.getAttribute('data-dark') : titleIcon.getAttribute('data-light');
          if (iconSrc) titleIcon.src = iconSrc;
        }
      }
      function detectTheme() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') return saved;
        } catch (e) {}
        return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.addEventListener('themechange', function (e) {
        applyFavicon(e.detail && e.detail.theme);
      });
      document.addEventListener('DOMContentLoaded', function () {
        applyFavicon(document.documentElement.getAttribute('data-theme') || detectTheme());
      });
    })();
  </script>
  {%- seo -%}
  <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  {%- feed_meta -%}
  {%- if jekyll.environment == 'production' and site.google_analytics -%}
    {%- include google-analytics.html -%}
  {%- endif -%}
  <script src="{{ "/assets/js/theme.js" | relative_url }}"></script>
  <script src="{{ "/assets/js/bg-particles.js" | relative_url }}" defer></script>
  {%- if page.custom_css -%}
    <!-- 页面专属样式（按需加载） -->
    <link rel="stylesheet" href="{{ page.custom_css | relative_url }}">
  {%- endif -%}
  {%- if page.custom_js -%}
    <!-- 页面专属脚本（按需加载，defer 保证 DOM 就绪后执行） -->
    <script src="{{ page.custom_js | relative_url }}" defer></script>
  {%- endif -%}
</head>
