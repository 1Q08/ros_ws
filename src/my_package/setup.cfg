# ============================================================
# 文件作用：setup.cfg 是 setuptools 的配置文件，采用 INI 格式，
# 用于声明 Python 功能包构建/安装时的脚本目录等选项。
#   - 与 setup.py 配合，共同完成 ament_python 包的安装配置
#   - 这里的 script_dir 决定可执行脚本（console_scripts）的安装位置
# ============================================================

# develop 模式（pip install -e / 源码开发安装）下的配置
[develop]
# 开发模式下可执行脚本安装到 $base/lib/<包名> 目录
# $base 是安装时的前缀路径（本地通常是 install 目录）
script_dir=$base/lib/my_package

# install 模式（正式安装）下的配置
[install]
# 正式安装时同样把可执行脚本放到 $base/lib/<包名> 目录，
# 保证 ros2 run 能从统一路径找到节点脚本
install_scripts=$base/lib/my_package
